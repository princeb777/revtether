[package]
name = "revtether"
version = "0.1.0"
edition = "2024"
description = "Reverse tethering over USB: share your PC's internet with an Android phone via adb"
license = "Apache-2.0"
repository = "https://github.com/princeb777/revtether"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
env_logger = "0.11.11"
log = "0.4.35"
mio = { version = "1", features = ["os-poll", "net"] }
rand = "0.10.3"
slab = "0.4.12"

[dev-dependencies]
socket2 = "0.6.5"

[profile.release]
opt-level = 3
lto = "fat"         # whole-program optimization
codegen-units = 1   # better optimization, slower build
panic = "abort"     # smaller binary, no unwinding tables
strip = true        # drop debug symbols
