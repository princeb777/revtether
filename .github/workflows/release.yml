name: CI and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests (unit + end-to-end relay tests)
        run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl # fully static: runs on any distro
            bin: revtether
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: revtether.exe
    runs-on: ${{ matrix.os }}
    env:
      # Static C runtime on Windows: no Visual C++ redistributable needed.
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: Build (optimized)
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Smoke test
        run: target/${{ matrix.target }}/release/${{ matrix.bin }} --version
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  release:
    name: Package and publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: bins
      - name: Download official adb (Android SDK Platform-Tools)
        run: |
          set -euo pipefail
          for os in linux windows; do
            curl -fsSL -o "pt-$os.zip" "https://dl.google.com/android/repository/platform-tools-latest-$os.zip"
            unzip -q "pt-$os.zip" -d "pt-$os"
          done
      - name: Assemble zips
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME}"
          mkdir -p dist

          L="revtether-$V-linux-x86_64"
          mkdir "$L"
          cp bins/bin-x86_64-unknown-linux-musl/revtether "$L/"
          cp pt-linux/platform-tools/adb "$L/"
          chmod +x "$L/revtether" "$L/adb"
          cp pt-linux/platform-tools/NOTICE.txt "$L/adb-NOTICE.txt"
          cp apk/gnirehtet.apk README.md LICENSE NOTICE "$L/"
          zip -qr "dist/$L.zip" "$L"

          W="revtether-$V-windows-x86_64"
          mkdir "$W"
          cp bins/bin-x86_64-pc-windows-msvc/revtether.exe "$W/"
          cp pt-windows/platform-tools/adb.exe pt-windows/platform-tools/*.dll "$W/"
          cp pt-windows/platform-tools/NOTICE.txt "$W/adb-NOTICE.txt"
          cp packaging/windows/revtether-run.cmd apk/gnirehtet.apk README.md LICENSE NOTICE "$W/"
          zip -qr "dist/$W.zip" "$W"

          (cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          for z in dist/*.zip; do echo "== $z"; unzip -l "$z"; done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "revtether $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md
